[build]
  command = "npm run build"
  publish = "dist"

# Prod countdown drill (7:27 PM PH, Oct 11 2026). Remove after test.
[context.production.environment]
  VITE_GRAND_ENTRY_AT = "2026-10-11T19:27:00+08:00"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
